services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-growatt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-growatt}
      POSTGRES_DB: ${POSTGRES_DB:-growatt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-growatt} -d ${POSTGRES_DB:-growatt}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-growatt}:${POSTGRES_PASSWORD:-growatt}@db:5432/${POSTGRES_DB:-growatt}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-growatt}:${POSTGRES_PASSWORD:-growatt}@db:5432/${POSTGRES_DB:-growatt}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./snapshots:/app/snapshots
    restart: unless-stopped

volumes:
  pgdata:
